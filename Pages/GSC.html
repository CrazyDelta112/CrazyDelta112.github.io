<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Community-made GSC scripts for Call of Duty: Modern Warfare, Black Ops, and more.">
  <title>NovaSix | GSC Scripts</title>
  <link rel="icon" type="image/png" href="/Assets/Images/Favicon.png">
  <link rel="stylesheet" href="/CSS/main.css">
  <link rel="stylesheet" href="/CSS/mainmenu.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    .gsc-layout {
      display: flex;
      flex-wrap: wrap;
      gap: 2rem;
      margin-top: 1rem;
      align-items: flex-start;
    }
    .game-selector {
      flex: 0 0 280px;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }
    .game-card {
      background: var(--glass-bg);
      backdrop-filter: blur(var(--blur-amount));
      -webkit-backdrop-filter: blur(var(--blur-amount));
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 1rem 1.2rem;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      color: inherit;
    }
    .game-card:hover, .game-card.active {
      border-color: var(--accent-primary);
      background: rgba(255,255,255,0.08);
    }
    .game-card i {
      font-size: 1.8rem;
      width: 40px;
      text-align: center;
      color: var(--accent-primary);
    }
    .game-card h4 {
      margin: 0;
      font-size: 1.1rem;
    }
    .game-card p {
      margin: 0.2rem 0 0;
      font-size: 0.8rem;
      color: var(--text-secondary);
    }
    .scripts-list {
      flex: 1;
      min-width: 300px;
    }
    .script-item {
      background: var(--glass-bg);
      backdrop-filter: blur(var(--blur-amount));
      -webkit-backdrop-filter: blur(var(--blur-amount));
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 1.5rem;
      margin-bottom: 1rem;
      transition: transform 0.2s;
    }
    .script-item:hover {
      transform: translateY(-2px);
    }
    .script-title {
      font-size: 1.2rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.3rem;
    }
    .script-desc {
      color: var(--text-secondary);
      margin: 0.5rem 0 1rem;
    }
    .script-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: var(--text-secondary);
    }
    .download-gsc-btn {
      background: var(--accent-primary);
      color: #000;
      border: none;
      padding: 0.4rem 1rem;
      border-radius: 20px;
      font-weight: bold;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .download-gsc-btn:hover {
      opacity: 0.8;
    }
    .empty-scripts {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--text-secondary);
      font-size: 1.2rem;
    }
    @media (max-width: 768px) {
      .gsc-layout {
        flex-direction: column;
      }
      .game-selector {
        flex: 0 0 auto;
        width: 100%;
        flex-direction: row;
        flex-wrap: wrap;
      }
      .game-card {
        flex: 1 1 45%;
      }
    }
  </style>
</head>
<body>
  <div class="background-blur"><img class="bg-full" alt=""></div>
  <div class="container">
    <main class="content">

      <section class="hero-section">
        <h1 class="hero-title"><i class="fas fa-scroll"></i> GSC Scripts</h1>
        <p class="hero-subtitle">Community-made scripts for your favorite Call of Duty titles</p>
      </section>

      <div class="gsc-layout">
        <!-- Game selector -->
        <div class="game-selector" id="gameSelector"></div>

        <!-- Scripts list -->
        <div class="scripts-list" id="scriptsPanel">
          <div class="empty-scripts">
            <i class="fas fa-hand-point-left" style="font-size: 2.5rem; opacity: 0.5;"></i>
            <p>Select a game to view available GSC scripts.</p>
          </div>
        </div>
      </div>

      <div class="credits-line" style="margin-top: 2rem;">
        <i class="fas fa-code-branch"></i> Scripts provided by the community. Use at your own risk.
      </div>
      <div class="footer-container">
        <img class="footer-logo" src="/Assets/Images/Logo.png" alt="NovaSix">
        <div class="footer-brand"><p>the central hub of the Call of Duty community</p></div>
        <div class="footer-stores">
          <a href="https://discord.gg/6zuVkCY7xq" class="store-link" target="_blank">Discord</a>
          <a href="/about.html" class="store-link">About</a>
        </div>
      </div>

    </main>
  </div>

  <script src="/JS/Main.js" defer></script>
  <script>
    (function() {
      // ---------- GSC DATA ----------
      const games = [
        {
          id: "mw2019",
          name: "Modern Warfare 2019",
          icon: "fas fa-crosshairs",
          scripts: [
            {
              title: "Unlock All",
              description: "Unlocks all weapons, camos, and attachments.",
              author: "Modder123",
              download: "#"
            },
            {
              title: "No Recoil",
              description: "Removes weapon recoil completely.",
              author: "ProGamer",
              download: "#"
            }
          ]
        },
        {
          id: "mwii",
          name: "Modern Warfare II",
          icon: "fas fa-skull",
          scripts: [
            {
              title: "Fast Reload",
              description: "Doubles reload speed for all weapons.",
              author: "SpeedDemon",
              download: "#"
            },
            {
              title: "UAV Always On",
              description: "Permanent mini-map radar.",
              author: "Hackerman",
              download: "#"
            }
          ]
        },
        {
          id: "bo6",
          name: "Black Ops 6",
          icon: "fas fa-robot",
          scripts: [
            {
              title: "Zombie God Mode",
              description: "Invincibility in Zombies mode.",
              author: "UndeadSlayer",
              download: "#"
            }
          ]
        }
      ];

      const selector = document.getElementById('gameSelector');
      const panel = document.getElementById('scriptsPanel');

      // Render game cards
      games.forEach(game => {
        const card = document.createElement('div');
        card.className = 'game-card';
        card.setAttribute('data-game-id', game.id);
        card.innerHTML = `<i class="${game.icon}"></i><div><h4>${game.name}</h4><p>${game.scripts.length} scripts</p></div>`;
        card.addEventListener('click', () => loadScripts(game.id));
        selector.appendChild(card);
      });

      // Select first game by default
      if (games.length > 0) loadScripts(games[0].id);

      function loadScripts(gameId) {
        // Highlight active game card
        document.querySelectorAll('.game-card').forEach(card => {
          card.classList.remove('active');
          if (card.getAttribute('data-game-id') === gameId) card.classList.add('active');
        });

        const game = games.find(g => g.id === gameId);
        if (!game) return;

        let html = '';
        if (game.scripts.length === 0) {
          html = '<div class="empty-scripts">No scripts available for this game yet.</div>';
        } else {
          game.scripts.forEach(script => {
            html += `
              <div class="script-item">
                <div class="script-title"><i class="fas fa-file-code"></i> ${script.title}</div>
                <div class="script-desc">${script.description}</div>
                <div class="script-meta">
                  <span>by ${script.author}</span>
                  <a href="${script.download}" class="download-gsc-btn" target="_blank"><i class="fas fa-download"></i> Download</a>
                </div>
              </div>`;
          });
        }

        panel.innerHTML = html;
      }
    })();
  </script>
</body>
</html>
