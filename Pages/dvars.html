<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Browse encrypted and decrypted dvars for Call of Duty games.">
  <title>NovaSix | Dvar Explorer</title>
  <link rel="icon" type="image/png" href="/Assets/Images/Favicon.png">
  <link rel="stylesheet" href="/CSS/main.css">
  <link rel="stylesheet" href="/CSS/mainmenu.css">
  <link rel="stylesheet" href="/CSS/dvar.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
  <div class="container">
    <main class="content">
      <div class="dvar-header">
        <h1>DVAR EXPLORER</h1>
        <p>Encrypted & decrypted dvars for Call of Duty titles</p>
      </div>
      <div class="game-tabs" id="gameTabs">
        <button class="game-tab active" data-game="mw19">Modern Warfare 2019</button>
        <button class="game-tab" data-game="mwii">Modern Warfare II</button>
      </div>

      <div class="dvar-controls glass">
        <div class="search-wrapper">
          <i class="fas fa-search"></i>
          <input type="text" id="searchInput" placeholder="Search by encrypted or decrypted dvar...">
        </div>
        <div class="dvar-count" id="resultCount"></div>
      </div>
      <div id="dvarList" class="dvar-list">
        <div class="loading">Loading dvars...</div>
      </div>
    </main>
  </div>
  <script src="/JS/main.js" defer></script>
  <script src="/JS/dvar.js"></script>
</body>
</html>
