<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Browse the NovaSix archive of game dumps, extracted assets, documents and tools.">
  <title>NovaSix | File Archive</title>
  <link rel="icon" type="image/png" href="/Assets/Images/Favicon.png">
  <link rel="stylesheet" href="/CSS/main.css">
  <link rel="stylesheet" href="/CSS/files.css">
  <link rel="stylesheet" href="/CSS/mainmenu.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
  <div class="background-blur"><img class="bg-full" alt=""></div>
  <div class="container">
    <main class="content">
      <div class="archive-header">
        <h1>FILE ARCHIVE</h1>
        <p>Game dumps, extracted assets, documents, tools – all in one place</p>
      </div>
      <div class="filters-bar glass">
        <div class="filter-group">
          <label><i class="fas fa-gamepad"></i> Game</label>
          <select id="gameFilter" class="filter-select">
            <option value="all">All Games</option>
          </select>
        </div>
        <div class="filter-group">
          <label><i class="fas fa-tag"></i> Category</label>
          <select id="categoryFilter" class="filter-select">
            <option value="all">All Categories</option>
          </select>
        </div>
        <div class="filter-group">
          <label><i class="fas fa-search"></i> Search</label>
          <input type="text" id="searchInput" class="search-input" placeholder="File name, description...">
        </div>
      </div>
      <div id="filesGrid" class="files-grid">
        <div class="loading">Loading archive...</div>
      </div>
    </main>
  </div>
  <script src="/JS/Main.js" defer></script>
  <script src="/JS/Files.js"></script>
</body>
</html>
