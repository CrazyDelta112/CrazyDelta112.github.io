<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Explore the latest Call of Duty mods and clients.">
  <title>NovaSix | Mods</title>
  <link rel="icon" type="image/png" href="/Assets/Images/Favicon.png">
  <link rel="stylesheet" href="/CSS/main.css">
  <link rel="stylesheet" href="/CSS/mods.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
  <div class="container">
    <main class="content">
       <div id="listView">
            <div class="mods-header">
                <h1>MODS & CLIENTS</h1>
                <p>Community mods and clients for Call of Duty titles</p>
            </div>

            <div class="control-bar glass" id="controlBar">
                <div class="search-wrapper">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Search mods...">
                </div>
                <div class="filter-buttons">
                    <button id="showAllBtn" class="filter-btn active"><i class="fas fa-th-list"></i> All</button>
                    <button id="showFavoritesBtn" class="filter-btn"><i class="fas fa-star"></i> Favorites</button>
                </div>
                <div class="view-toggle">
                    <button id="gridViewBtn" class="view-btn active" title="Grid"><i class="fas fa-th"></i></button>
                    <button id="listViewBtn" class="view-btn" title="List"><i class="fas fa-list"></i></button>
                </div>
            </div>

            <div id="modsContainer" class="mods-container">
                <div class="loading">Loading mods...</div>
            </div>
        </div>

        <div id="guideView" class="guide-view">
            <button class="back-button" id="backToListBtn">
                <i class="fas fa-arrow-left"></i> Back to Mods
            </button>
            <div id="guideContent"></div>
        </div>
    </main>
</div>

  <script src="/JS/mods.js" defer></script>
  <script src="/JS/main.js" defer></script>
</body>
</html>
