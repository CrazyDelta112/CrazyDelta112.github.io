<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NovaSix | News</title>
  <meta name="description" content="Stay updated with the latest news from  Call of Duty" />
  <link rel="icon" type="image/png" href="/Assets/Images/Favicon.png">
  <link rel="stylesheet" href="/CSS/main.css">
  <link rel="stylesheet" href="/CSS/mainmenu.css">
  <link rel="stylesheet" href="/CSS/news.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
  <div class="background-blur">
    <img alt="" class="bg-full">
  </div>
  <div class="container">
    <main class="content">
      <div class="news-header">
        <h1>NEWS HUB</h1>
        <p>Updates, rumors, leaks – everything Call of Duty</p>
      </div>

      <!-- Seção de listagem (visível quando não há hash ou hash é #/) -->
      <div id="listView">
        <div class="filter-bar glass">
          <div class="filter-group">
            <label><i class="fas fa-tag"></i> Category</label>
            <div id="categoryFilters" class="filter-buttons"></div>
          </div>
          <div class="filter-group">
            <label><i class="fas fa-search"></i> Search</label>
            <input type="text" id="searchInput" placeholder="Search news..." class="search-input">
          </div>
        </div>
        <div id="newsGrid" class="news-grid">
          <div class="loading">Loading news...</div>
        </div>
      </div>

      <!-- Seção de detalhe (visível quando hash aponta para um artigo) -->
      <div id="detailView" style="display: none;">
        <div id="articleContainer" class="detail-container glass">
          <div class="loading">Loading article...</div>
        </div>
      </div>

      <div class="footer-container">
        <img class="footer-logo" src="/Assets/Images/Logo.png">
        <div class="footer-brand"><p>the central hub of the Call of Duty community</p></div>
        <div class="footer-stores">
          <a href="https://discord.gg/6zuVkCY7xq" class="store-link" target="_blank">Discord</a>
          <a href="/about.html" class="store-link">About</a>
        </div>
        <div class="footer-legal">
          <p>Call of Duty Hub is not affiliated with Activision; we are simply a community website.</p>
          <p>Project NovaSix || Version: 2.6.5</p>
        </div>
      </div>
    </main>
  </div>

  <script src="/JS/main.js"></script>
  <script src="/JS/news.js"></script>
</body>
</html>
