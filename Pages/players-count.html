<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NovaSix | Steam Player Count</title>
  <link rel="icon" type="image/png" href="/Assets/Images/Main/Favicon.png">
  <link rel="stylesheet" href="/CSS/main.css">
  <link rel="stylesheet" href="/CSS/steam_pl.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
  <div class="container">
    <main class="content">
      <div class="test-header">
        <h1>Steam Player Count</h1>
        <p>Active players in Call of Duty games on Steam</p>
      </div>

      <div style="text-align: center;">
        <button id="refreshBtn" class="refresh-btn"><i class="fas fa-sync-alt"></i> Refresh</button>
        <div class="total-players" id="totalPlayers">Total: <strong id="totalCount">0</strong> players</div>
      </div>

      <div id="errorBox" class="error-box" style="display: none;"></div>

      <div id="playerGrid" class="player-grid">
        <div class="loading">Loading data...</div>
      </div>
    </main>
  </div>

  <script src="/JS/steam_pl.js" defer></script>
  <script src="/JS/main.js" defer></script>
   </body>
</html>
