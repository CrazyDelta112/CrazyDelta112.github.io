<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Explore our extensive assets storage collection from Call of Duty.">
  <title>NovaSix | Asset Depots</title>
  <link rel="icon" type="image/png" href="/Assets/Images/Favicon.png">
  <link rel="stylesheet" href="/CSS/mainmenu.css">
  <link rel="stylesheet" href="/CSS/main.css">
  <link rel="stylesheet" href="/CSS/storage.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
  <div class="background-blur">
    <img alt="" class="bg-full">
  </div>
  <div class="container">
    <main class="content">
      <div class="gallery-header glass">
        <div class="header-title">
          <h1>ASSET DEPOTS</h1>
          <p>Explore keyarts, loading screens, videos, and more – archived directly from Call of Duty titles.</p>
        </div>
      </div>
      <div id="gamesSection">
        <div id="gamesGrid" class="games-grid"></div>
      </div>
      <div id="itemsSection" style="display: none;">
        <div class="items-header">
          <button id="backToGamesBtn" class="back-btn"><i class="fas fa-arrow-left"></i> All Games</button>
          <div class="selected-game-info">
            <span class="selected-game-label">Browsing</span>
            <span id="selectedGameTitle" class="selected-game-name"></span>
          </div>
        </div>
        <div class="storage-layout">
          <aside class="categories-sidebar glass" id="categoriesSidebar">
            <h3><i class="fas fa-tags"></i> Categories</h3>
            <div id="categoryButtons" class="category-buttons"></div>
          </aside>
          <div class="storage-main">
            <div class="items-grid" id="itemsGrid">
              <div class="loading">Loading items...</div>
            </div>
            <div id="paginationContainer" class="pagination-container"></div>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="/JS/storage.js"></script>
  <script src="/JS/main.js" defer></script>
</body>
</html>
