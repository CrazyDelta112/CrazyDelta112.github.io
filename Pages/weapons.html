<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Browse weapon assets and IDs from Call of Duty titles.">
  <title>NovaSix | Weapons</title>
  <link rel="icon" type="image/png" href="/Assets/Images/Favicon.png">
  <link rel="stylesheet" href="/CSS/main.css">
  <link rel="stylesheet" href="/CSS/mainmenu.css">
  <link rel="stylesheet" href="/CSS/weapons.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
  <div class="container">
    <main class="content">
      <div class="weapons-header">
        <h1>WEAPONS</h1>
        <p>Explore weapon assets, IDs and in-game names</p>
      </div>
      <div class="game-tabs" id="gameTabs">
        <button class="game-tab active" data-game="mw19">Modern Warfare 2019</button>
        <button class="game-tab disabled" data-game="mwii" disabled>Modern Warfare II</button>
      </div>
      <div class="weapons-controls glass">
        <div class="search-wrapper">
          <i class="fas fa-search"></i>
          <input type="text" id="searchInput" placeholder="Search by name or ID...">
        </div>
        <div class="weapon-count" id="resultCount"></div>
      </div>
      <div id="weaponsGrid" class="weapons-grid">
        <div class="loading">Loading weapons...</div>
      </div>
    </main>
  </div>
  <script src="/JS/main.js" defer></script>
  <script src="/JS/weapons.js"></script>
</body>
</html>
