<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Splash Screen Converter</title>
  <link rel="stylesheet" href="Splash.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
  <div class="background-blur">
    <img alt="" class="bg-full">
  </div>
  <div class="container">
    <main class="content">
      <div class="tool-header">
        <h1>SPLASH SCREEN CONVERTER</h1>
        <p>Convert any image to Call of Duty splash screen format (843x480, 32‑bit BMP)</p>
      </div>

      <div class="converter-container glass">
        <div class="upload-area" id="uploadArea">
          <i class="fas fa-cloud-upload-alt"></i>
          <p>Click or drag and drop an image file</p>
          <input type="file" id="fileInput" accept="image/*" style="display: none;">
        </div>

        <div class="preview-area" id="previewArea" style="display: none;">
          <canvas id="previewCanvas" class="preview-canvas" width="421" height="240"></canvas>
        </div>

        <div class="info-text">
          <p><i class="fas fa-info-circle"></i> Output format: 843×480 pixels, 32‑bit BMP (BGRA). Transparency will be preserved.</p>
        </div>

        <button id="convertBtn" class="convert-btn" disabled>Convert to Splash BMP</button>
        <div id="errorMsg" class="error-text"></div>
        <div id="downloadArea" class="download-area" style="display: none;"></div>
      </div>
      <h1 style="text-align: center;font-size: 24px;">Made by Delta</h1>
    </main>
  </div>

    <script src="Splash.js"></script>
</body>
</html>
